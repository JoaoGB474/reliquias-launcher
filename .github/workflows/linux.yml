name: Linux

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      RL_SERVIDOR: ${{ vars.RL_SERVIDOR }}
      RL_SPKI: ${{ vars.RL_SPKI }}
      RL_DISCORD_CLIENT_ID: ${{ vars.RL_DISCORD_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libgtk-3-dev libssl-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: Swatinem/rust-cache@v2
      - name: Testes do núcleo
        run: cargo test -p launcher-core --lib
      - name: Java oficial no Linux
        run: cargo test -p launcher-core --test instalar java_oficial_21 -- --ignored --nocapture
      - name: Build
        working-directory: app
        run: |
          npm ci
          npx tauri build --bundles appimage,deb --config '{"productName":"Reliquias"}'
      - uses: actions/upload-artifact@v4
        with:
          name: reliquias-launcher-linux
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
